# Release gate settings for ubuntulemp2 3.0-1 (sourced by verify-image.sh and
# builder-release.sh).
GATE_TITLE="ubuntulemp2 3.0-1 Lemp Stack (Ubuntu 24.04, php8.3 from the Ubuntu archive, nginx + php-fpm + MySQL)"
GATE_IMAGE_NAME=ubuntulemp2
GATE_TAG=3.0-1
# Base = the Dockerfile's FROM (registry ubuntulemp2:latest on 2026-10-21).
GATE_BASE_IMAGE=
GATE_BASE_LAYERS_SHA256=470ecbcbd2ff42fa5f90075efc33325efa449b701f58f6a255555ae35e00dda5

GATE_PHP_SOURCE=php8.3
GATE_PHP_BRANCH=8.3
GATE_PHP_LAST_UNPATCHED=8.3.6-0ubuntu0.24.04.12
GATE_TRIAL_BUILD_ARGS=(PHP_MIN_VERSION=8.3.6-0ubuntu0.24.04.12)
GATE_FPM_BIN=php-fpm8.3
GATE_PHP_DEFAULT_CLI=/usr/bin/php8.3
GATE_SAPI=fpm-fcgi

GATE_IMAGE_CONFIG_ROOTS=(/etc/php /etc/nginx /etc/apache2 /etc/mysql /scripts /sources /etc/my_init.d /etc/service /sbin/my_init)
GATE_CONTENT_CHANGE_ALLOWED='^/etc/php/8\.3/[a-z0-9]+/php\.ini$'

# How the platform runs app 112: init, these volumes (appbinds), port 80.
# The first-run installer (scripts/mysql.sh) installs mysql-server with apt,
# so the container needs network access; APEX_CALLBACK=false keeps it from
# calling the install callback on api.cylo.io.
GATE_RUN_NETWORK=bridge
GATE_RUN_ENV=(APEX_CALLBACK=false)
GATE_VOLUMES=(/home/appbox/config /home/appbox/public_html /home/appbox/logs /home/appbox/mysql)
GATE_CONFIG_VOLUMES=(/home/appbox/config)
GATE_DOCROOT=/home/appbox/public_html
GATE_HTTP_PORT=80
GATE_READY_TIMEOUT=1500
GATE_RUNTIME_CHECKS=(
    "nginx -t -c /home/appbox/config/nginx/nginx.conf"
    "php-fpm8.3 -t --fpm-config /home/appbox/config/php-fpm/php-fpm.conf"
)
GATE_DB_CHECK="mysqladmin --socket=/run/mysqld/mysqld.sock ping"
